name: supabase
# Deploys database migrations + edge functions to the Senses Private Supabase
# project, reschedules the mindbody-sync cron with a fresh key, and smoke-tests
# the endpoints. Requires one repository secret: SUPABASE_ACCESS_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wvyqxafhiawwyexiggxh
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply database migrations
        run: |
          set -euo pipefail
          q() { # run SQL via the Supabase Management API; prints the JSON result
            curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg sql "$1" '{query:$sql}')"
          }
          q "create table if not exists _migrations (name text primary key, applied_at timestamptz not null default now())" > /dev/null
          # 0001-0003 were applied by hand before this pipeline existed.
          q "insert into _migrations (name) values ('0001_init.sql'),('0002_session_photos.sql'),('0003_seed_packages.sql') on conflict do nothing" > /dev/null
          applied=$(q "select name from _migrations" | jq -r '.[].name')
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f")
            if grep -qx "$n" <<< "$applied"; then
              echo "skip   $n (already applied)"
            else
              echo "apply  $n"
              q "$(cat "$f")" > /dev/null
              q "insert into _migrations (name) values ('$n')" > /dev/null
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          set -euo pipefail
          for fn in mindbody-health mindbody-discover mindbody-sync mindbody-client-sync admin-room-details create-checkout stripe-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Rotate sync key + (re)schedule cron
        run: |
          set -euo pipefail
          KEY=$(openssl rand -hex 24)
          echo "::add-mask::$KEY"
          supabase secrets set "SYNC_KEY=$KEY" --project-ref "$PROJECT_REF"
          SQL=$(cat <<EOSQL
          do \$\$ begin perform cron.unschedule('mindbody-sync'); exception when others then null; end \$\$;
          select cron.schedule('mindbody-sync', '*/5 * * * *', format(
            'select net.http_post(url:=%L, headers:=jsonb_build_object(''x-sync-key'', %L, ''Content-Type'', ''application/json''), body:=''{}''::jsonb, timeout_milliseconds:=30000)',
            'https://$PROJECT_REF.supabase.co/functions/v1/mindbody-sync', '$KEY'));
          do \$\$ begin perform cron.unschedule('mindbody-client-sync'); exception when others then null; end \$\$;
          select cron.schedule('mindbody-client-sync', '*/15 * * * *', format(
            'select net.http_post(url:=%L, headers:=jsonb_build_object(''x-sync-key'', %L, ''Content-Type'', ''application/json''), body:=''{}''::jsonb, timeout_milliseconds:=120000)',
            'https://$PROJECT_REF.supabase.co/functions/v1/mindbody-client-sync', '$KEY'));
          EOSQL
          )
          curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg sql "$SQL" '{query:$sql}')" > /dev/null
          echo "cron scheduled (*/5) with fresh key"
          # secrets propagation to the edge runtime can lag a little
          sleep 20
          echo "== first sync run =="
          curl -sS -X POST -H "x-sync-key: $KEY" \
            "https://$PROJECT_REF.supabase.co/functions/v1/mindbody-sync" | head -c 4000

          echo "== first client package sync (counts only) =="
          curl -sS --max-time 140 -X POST -H "x-sync-key: $KEY" \
            "https://$PROJECT_REF.supabase.co/functions/v1/mindbody-client-sync" | head -c 1000

      - name: Smoke tests
        run: |
          set -euo pipefail
          base="https://$PROJECT_REF.supabase.co/functions/v1"
          echo "== mindbody-discover =="
          curl -sS "$base/mindbody-discover" | head -c 6000
          echo
          echo "== mindbody-health =="
          curl -sS "$base/mindbody-health" | head -c 4000

      - name: Publish smoke results as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://$PROJECT_REF.supabase.co/functions/v1"
          d=$(curl -sS "$base/mindbody-discover" | head -c 5500 || echo '(discover unreachable)')
          h=$(curl -sS "$base/mindbody-health" | head -c 3000 || echo '(health unreachable)')
          printf 'CI smoke results (run %s)\n\n### mindbody-discover\n```json\n%s\n```\n\n### mindbody-health\n```json\n%s\n```\n' \
            "$GITHUB_RUN_ID" "$d" "$h" > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" > /dev/null
          echo "commit comment posted"
